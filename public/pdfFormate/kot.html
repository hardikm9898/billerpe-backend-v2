<!DOCTYPE html>
<html lang="en">

<style>
    html,
    body {
        margin: 0px;
        padding: 0px;
    }

    @import url('https://fonts.cdnfonts.com/css/verdana');

    .invoice {
        width: 650px;
        font-family: 'Verdana', sans-serif;
    }

    .invoice p {
        margin-bottom: 5px;
        margin-top: 0;
        font-weight: 400;
        font-size: 38px;
    }

    .invoice strong {
        margin-bottom: 5px;
        margin-top: 0;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: 0.5px;
    }

    .invoice-header {
        text-align: center;
        border-bottom: 2px dashed #000;
    }

    .hotel-name {
        margin-bottom: 5px;
        margin-top: 0;
        font-weight: 600 !important;
        font-size: 38px !important;
    }

    .custom-table-header {
        display: flex;
        gap: 35%;
        margin-top: 5px;
        border-bottom: 2px dashed #000;
    }

    .invoice-items tr {
        border: none;
    }

    .invoice-items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }

    .invoice-items th,
    .invoice-items td {

        vertical-align: top;
        padding: 1px;
        text-align: center;
        border: none;
        color: #000;
        font-size: 35px;
        font-weight: 400;
    }

    .invoice-items td:first-child,
    .invoice-items th:first-child {
        text-align: left;
    }

    .invoice-items th:nth-child(3) {
        width: 55%;
    }

    .invoice-items th {
        font-size: 38px !important;
        font-weight: 400;
    }
</style>

<body>

        </div>

        <div class="custom-table-header">

        <table class="invoice-items">

                <tr>

                    <th>Item</th>

</body>

</html>
